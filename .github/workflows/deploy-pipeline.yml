name: Deploy Dataflow Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'fpa-project/pipeline/**'
      - '.github/workflows/deploy-pipeline.yml'

env:
  GAR_LOCATION: us-central1
  REPOSITORY: fpa-repo
  SDK_IMAGE_NAME: dataflow-sdk

jobs:
  deploy:
    name: Build SDK & Submit Dataflow Job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fpa-project/pipeline/requirements.txt pg8000

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.DEPLOYER_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Credentials for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Tag Custom SDK Container Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SDK_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SDK_IMAGE_NAME }}:latest \
            ./fpa-project/pipeline

      - name: Push Custom SDK Image to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SDK_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SDK_IMAGE_NAME }}:latest


      - name: Submit Streaming Job to Google Cloud Dataflow
        run: |
          python fpa-project/pipeline/main.py \
            --runner=DataflowRunner \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=us-central1 \
            --machine_type=n1-standard-1 \
            --num_workers=1 \
            --max_num_workers=1 \
            --temp_location=gs://${{ secrets.GCP_PROJECT_ID }}-dataflow-storage/temp \
            --staging_location=gs://${{ secrets.GCP_PROJECT_ID }}-dataflow-storage/staging \
            --service_account_email=dataflow-worker@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --input_subscription=projects/${{ secrets.GCP_PROJECT_ID }}/subscriptions/transactions-sub \
            --alerts_topic=projects/${{ secrets.GCP_PROJECT_ID }}/topics/budget-breaches-alerts \
            --db_instance_connection_name=${{ secrets.GCP_PROJECT_ID }}:${{ env.GAR_LOCATION }}:fpa-budget-db \
            --db_name=budget_registry \
            --db_user=pgadmin \
            --db_password=${{ secrets.DB_PASSWORD }} \
            --sdk_container_image=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SDK_IMAGE_NAME }}:${{ github.sha }} \
            --job_name=fpa-pipeline-job
